spring.application.name=registration-service

server.port=8083

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/registration_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

course-service.base-url=http://localhost:8082

jwt.secret=${JWT_SECRET:CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te}
